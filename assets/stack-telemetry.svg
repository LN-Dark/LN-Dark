<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290">
  <defs>
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .layer-title { font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .layer-tech { font-size: 12px; fill: #94A3B8; }
    .badge { font-size: 10px; font-weight: 700; fill: #00F0FF; letter-spacing: 1.5px; }
    
    @keyframes pulseBar {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.55; }
    }
    .bar-anim { animation: pulseBar 3.5s ease-in-out infinite; }
  </style>

  <rect width="1200" height="290" rx="14" fill="url(#bgCard)" stroke="#1E293B" stroke-width="2" />

  <!-- Cabeçalho do Painel -->
  <text x="35" y="38" class="mono badge">TELEMETRIA DE ENGENHARIA // ARQUITETURA SOBERANA L1 → L5</text>
  <text x="1165" y="38" text-anchor="end" class="mono badge" fill="#10B981">● ZERO CLOUD DEPENDENCY</text>
  <line x1="35" y1="52" x2="1165" y2="52" stroke="#1E293B" stroke-width="1" />

  <!-- L1 -->
  <g transform="translate(35, 72)">
    <text x="0" y="15" class="mono layer-title" fill="#00F0FF">L1 · APLICACIONAL & MOBILE</text>
    <text x="260" y="15" class="sans layer-tech">CodeIgniter 4 · PHP 8+ · Flutter (Android/iOS/Desktop) · JS/TS · REST APIs</text>
    <rect x="850" y="4" width="280" height="12" rx="6" fill="#0F172A" />
    <rect class="bar-anim" x="850" y="4" width="272" height="12" rx="6" fill="url(#barCyan)" />
  </g>

  <!-- L2 -->
  <g transform="translate(35, 114)">
    <text x="0" y="15" class="mono layer-title" fill="#38BDF8">L2 · IA LOCAL & VISÃO</text>
    <text x="260" y="15" class="sans layer-tech">Ollama (On-Premise LLMs) · Python Computer Vision · ComfyUI · n8n Workflows</text>
    <rect x="850" y="4" width="280" height="12" rx="6" fill="#0F172A" />
    <rect class="bar-anim" x="850" y="4" width="255" height="12" rx="6" fill="url(#barCyan)" />
  </g>

  <!-- L3 -->
  <g transform="translate(35, 156)">
    <text x="0" y="15" class="mono layer-title" fill="#6366F1">L3 · DADOS & MOTOR FISCAL</text>
    <text x="260" y="15" class="sans layer-tech">MySQL / MariaDB · Otimização SQL Crítica · Synology NAS RAID · Backups Imutáveis</text>
    <rect x="850" y="4" width="280" height="12" rx="6" fill="#0F172A" />
    <rect class="bar-anim" x="850" y="4" width="265" height="12" rx="6" fill="url(#barPurple)" />
  </g>

  <!-- L4 -->
  <g transform="translate(35, 198)">
    <text x="0" y="15" class="mono layer-title" fill="#8B5CF6">L4 · REDES & INFRAESTRUTURA</text>
    <text x="260" y="15" class="sans layer-tech">Cisco CCNA · Docker · Linux & Windows Server · OpenVPN · Tailscale / Headscale</text>
    <rect x="850" y="4" width="280" height="12" rx="6" fill="#0F172A" />
    <rect class="bar-anim" x="850" y="4" width="260" height="12" rx="6" fill="url(#barPurple)" />
  </g>

  <!-- L5 -->
  <g transform="translate(35, 240)">
    <text x="0" y="15" class="mono layer-title" fill="#EC4899">L5 · CIBERSEGURANÇA & SIEM</text>
    <text x="260" y="15" class="sans layer-tech">Wazuh SIEM · Zero-Trust Access · RustDesk Self-Hosted · Auditoria & Hardening</text>
    <rect x="850" y="4" width="280" height="12" rx="6" fill="#0F172A" />
    <rect class="bar-anim" x="850" y="4" width="250" height="12" rx="6" fill="url(#barPurple)" />
  </g>
</svg>
