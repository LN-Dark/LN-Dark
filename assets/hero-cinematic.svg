<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B" />
      <stop offset="50%" stop-color="#0A0F1D" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    .title { font-size: 54px; font-weight: 800; fill: #F8FAFC; letter-spacing: -1.5px; }
    .subtitle { font-size: 22px; font-weight: 400; fill: #94A3B8; }
    .tag { font-size: 12px; font-weight: 700; fill: #00F0FF; letter-spacing: 2.5px; }
    .hud { font-size: 11px; font-weight: 600; fill: #64748B; letter-spacing: 1.5px; }
    .metric-val { font-size: 26px; font-weight: 800; fill: #F8FAFC; }
    .metric-lbl { font-size: 10px; font-weight: 600; fill: #64748B; letter-spacing: 1px; }

    @keyframes scanline {
      0% { transform: translateY(-400px); }
      100% { transform: translateY(400px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translate(940px, 195px) translateY(0px); }
      50% { transform: translate(940px, 195px) translateY(-10px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes l1Glow { 0%, 100% { stroke: #1E293B; } 20% { stroke: #00F0FF; } }
    @keyframes l2Glow { 0%, 100% { stroke: #1E293B; } 40% { stroke: #38BDF8; } }
    @keyframes l3Glow { 0%, 100% { stroke: #1E293B; } 60% { stroke: #6366F1; } }
    @keyframes l4Glow { 0%, 100% { stroke: #1E293B; } 80% { stroke: #8B5CF6; } }
    @keyframes l5Glow { 0%, 100% { stroke: #1E293B; } 95% { stroke: #EC4899; } }

    .scanner { animation: scanline 8s linear infinite; }
    .dot-live { animation: pulse 2s ease-in-out infinite; }
    .iso-stack { animation: floatSlow 6s ease-in-out infinite; }
    .data-line { stroke-dasharray: 12 8; animation: dash 25s linear infinite; }
    
    .l1 { animation: l1Glow 5s infinite; }
    .l2 { animation: l2Glow 5s infinite; }
    .l3 { animation: l3Glow 5s infinite; }
    .l4 { animation: l4Glow 5s infinite; }
    .l5 { animation: l5Glow 5s infinite; }
  </style>

  <!-- Fundo e Grelha -->
  <rect width="1200" height="400" rx="16" fill="url(#bg)" />
  <rect width="1200" height="400" rx="16" fill="url(#grid)" />
  
  <!-- Ondas de Rede Animadas -->
  <path class="data-line" d="M 0 320 Q 300 270 600 320 T 1200 300" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.35" />
  <path class="data-line" d="M 0 345 Q 400 385 800 315 T 1200 355" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" />

  <!-- Efeito Scanline -->
  <rect class="scanner" width="1200" height="130" fill="url(#scan)" />

  <!-- Moldura Exterior -->
  <rect x="2" y="2" width="1196" height="396" rx="14" fill="none" stroke="#1E293B" stroke-width="2" />
  <line x1="60" y1="2" x2="360" y2="2" stroke="url(#accent)" stroke-width="3" />

  <!-- Barra de Topo HUD -->
  <circle class="dot-live" cx="68" cy="46" r="5" fill="#10B981" />
  <text x="84" y="50" class="font-mono tag">ARQUITETURA · SOFTWARE · IA · REDES · SEGURANÇA</text>
  <text x="1140" y="50" text-anchor="end" class="font-mono hud">SYS.STACK // L1 → L5 [ONLINE]</text>

  <!-- Títulos Principais -->
  <text x="64" y="132" class="font-sans title">Pedro Cruz</text>
  <text x="365" y="132" class="font-mono" font-size="22" font-weight="700" fill="#00F0FF">/ LN-Dark</text>
  
  <text x="64" y="178" class="font-sans subtitle">
    Construo <tspan fill="#F8FAFC" font-weight="700">tudo o que está por baixo.</tspan>
  </text>
  <text x="64" y="212" class="font-sans" font-size="15" fill="#64748B">
    Desenho a arquitetura, escrevo o código, treino a camada de IA, monto a rede e defino a segurança — e respondo por tudo em produção.
  </text>

  <!-- Cartões de Métricas -->
  <g transform="translate(64, 268)">
    <rect width="165" height="78" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.5" />
    <text x="20" y="36" class="font-mono metric-val" fill="#00F0FF">13+</text>
    <text x="20" y="58" class="font-mono metric-lbl">ANOS A DESENVOLVER</text>

    <g transform="translate(182, 0)">
      <rect width="165" height="78" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.5" />
      <text x="20" y="36" class="font-mono metric-val">17+</text>
      <text x="20" y="58" class="font-mono metric-lbl">PRODUTOS EM PRODUÇÃO</text>
    </g>

    <g transform="translate(364, 0)">
      <rect width="165" height="78" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.5" />
      <text x="20" y="36" class="font-mono metric-val">5</text>
      <text x="20" y="58" class="font-mono metric-lbl">DOMÍNIOS CRÍTICOS</text>
    </g>

    <g transform="translate(546, 0)">
      <rect width="165" height="78" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.5" />
      <text x="20" y="36" class="font-mono metric-val" fill="#38BDF8">CCNA</text>
      <text x="20" y="58" class="font-mono metric-lbl">CISCO NETWORKING</text>
    </g>
  </g>

  <!-- Pilha 3D Isométrica Animada (Direita) -->
  <g class="iso-stack" transform="translate(940, 195)">
    <polygon class="l5" points="0,45 110,90 0,135 -110,90" fill="#090D16" fill-opacity="0.9" stroke-width="2" />
    <text x="120" y="94" class="font-mono hud" fill="#EC4899">L5 · SIEM & SEGURANÇA</text>

    <polygon class="l4" points="0,10 110,55 0,100 -110,55" fill="#0B1120" fill-opacity="0.9" stroke-width="2" />
    <text x="120" y="59" class="font-mono hud" fill="#8B5CF6">L4 · REDES & BARE-METAL</text>

    <polygon class="l3" points="0,-25 110,20 0,65 -110,20" fill="#0F172A" fill-opacity="0.9" stroke-width="2" />
    <text x="120" y="24" class="font-mono hud" fill="#6366F1">L3 · DADOS & MOTOR SQL</text>

    <polygon class="l2" points="0,-60 110,-15 0,30 -110,-15" fill="#111C35" fill-opacity="0.9" stroke-width="2" />
    <text x="120" y="-11" class="font-mono hud" fill="#38BDF8">L2 · IA LOCAL & VISÃO</text>

    <polygon class="l1" points="0,-95 110,-50 0,-5 -110,-50" fill="#162447" fill-opacity="0.95" stroke-width="2.5" />
    <text x="120" y="-46" class="font-mono hud" fill="#00F0FF">L1 · ERP, WEB & FLUTTER</text>

    <line x1="0" y1="-115" x2="0" y2="115" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="0" cy="-50" r="4" fill="#00F0FF" />
  </g>

  <text x="825" y="365" class="font-mono hud">OBJ.01 — PILHA DO SISTEMA // SPIRE & ACCOUNTECH</text>
</svg>
