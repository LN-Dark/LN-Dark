<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B" />
      <stop offset="50%" stop-color="#0A0F1A" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    .title { font-size: 52px; font-weight: 800; fill: #F8FAFC; letter-spacing: -1.5px; }
    .subtitle { font-size: 22px; font-weight: 400; fill: #94A3B8; letter-spacing: -0.3px; }
    .tag { font-size: 12px; font-weight: 600; fill: #00F0FF; letter-spacing: 2.5px; }
    .hud { font-size: 11px; fill: #64748B; letter-spacing: 1.5px; }
    .metric-val { font-size: 24px; font-weight: 800; fill: #F8FAFC; }
    .metric-lbl { font-size: 10px; fill: #64748B; letter-spacing: 1.2px; }

    @keyframes scanline {
      0% { transform: translateY(-380px); }
      100% { transform: translateY(380px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes layerGlow1 { 0%, 100% { stroke: #1E293B; } 20% { stroke: #00F0FF; } }
    @keyframes layerGlow2 { 0%, 100% { stroke: #1E293B; } 40% { stroke: #38BDF8; } }
    @keyframes layerGlow3 { 0%, 100% { stroke: #1E293B; } 60% { stroke: #6366F1; } }
    @keyframes layerGlow4 { 0%, 100% { stroke: #1E293B; } 80% { stroke: #8B5CF6; } }
    @keyframes layerGlow5 { 0%, 100% { stroke: #1E293B; } 95% { stroke: #EC4899; } }

    .scanner { animation: scanline 7s linear infinite; }
    .dot-live { animation: pulse 2s ease-in-out infinite; }
    .iso-stack { animation: floatSlow 6s ease-in-out infinite; }
    .data-line { stroke-dasharray: 12 8; animation: dash 25s linear infinite; }
    
    .l1 { animation: layerGlow1 5s infinite; }
    .l2 { animation: layerGlow2 5s infinite; }
    .l3 { animation: layerGlow3 5s infinite; }
    .l4 { animation: layerGlow4 5s infinite; }
    .l5 { animation: layerGlow5 5s infinite; }
  </style>

  <!-- Background & Grid -->
  <rect width="1200" height="380" rx="16" fill="url(#bg)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />
  
  <!-- Animated Data Wave -->
  <path class="data-line" d="M 0 310 Q 300 260 600 310 T 1200 290" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.35" />
  <path class="data-line" d="M 0 330 Q 400 370 800 300 T 1200 340" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" />

  <!-- Scanline Effect -->
  <rect class="scanner" width="1200" height="120" fill="url(#scan)" />

  <!-- Outer Frame Border -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <line x1="60" y1="1.5" x2="320" y2="1.5" stroke="url(#accent)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Top HUD Bar -->
  <circle class="dot-live" cx="68" cy="44" r="4.5" fill="#10B981" filter="url(#glow)" />
  <text x="82" y="48" class="font-mono tag">ARQUITETURA · SOFTWARE · IA · REDES · SEGURANÇA</text>
  <text x="1140" y="48" text-anchor="end" class="font-mono hud">SYS.STACK // L1 → L5 [ONLINE]</text>

  <!-- Main Copy -->
  <text x="64" y="130" class="font-sans title">Pedro Cruz</text>
  <text x="355" y="130" class="font-mono" font-size="20" fill="#00F0FF" opacity="0.85">/ LN-Dark</text>
  
  <text x="64" y="175" class="font-sans subtitle">
    Construo <tspan fill="#F8FAFC" font-weight="600">tudo o que está por baixo.</tspan>
  </text>
  <text x="64" y="208" class="font-sans" font-size="15" fill="#64748B">
    Desenho a arquitetura, escrevo o código, treino a camada de IA, monto a rede e defino a segurança.
  </text>

  <!-- Bottom Metrics HUD -->
  <g transform="translate(64, 260)">
    <rect width="165" height="74" rx="8" fill="#0B1120" fill-opacity="0.8" stroke="#1E293B" />
    <text x="20" y="34" class="font-mono metric-val" fill="#00F0FF">13+</text>
    <text x="20" y="54" class="font-mono metric-lbl">ANOS A DESENVOLVER</text>

    <g transform="translate(185, 0)">
      <rect width="165" height="74" rx="8" fill="#0B1120" fill-opacity="0.8" stroke="#1E293B" />
      <text x="20" y="34" class="font-mono metric-val">17+</text>
      <text x="20" y="54" class="font-mono metric-lbl">PRODUTOS EM PRODUÇÃO</text>
    </g>

    <g transform="translate(370, 0)">
      <rect width="165" height="74" rx="8" fill="#0B1120" fill-opacity="0.8" stroke="#1E293B" />
      <text x="20" y="34" class="font-mono metric-val">5</text>
      <text x="20" y="54" class="font-mono metric-lbl">DOMÍNIOS DE ENGENHARIA</text>
    </g>

    <g transform="translate(555, 0)">
      <rect width="165" height="74" rx="8" fill="#0B1120" fill-opacity="0.8" stroke="#1E293B" />
      <text x="20" y="34" class="font-mono metric-val" fill="#38BDF8">CCNA</text>
      <text x="20" y="54" class="font-mono metric-lbl">CISCO NETWORKING</text>
    </g>
  </g>

  <!-- Right 3D Isometric System Stack (obj.01 — pilha do sistema) -->
  <g class="iso-stack" transform="translate(970, 185)">
    <!-- Layer 5: Security & Network -->
    <polygon class="l5" points="0,45 120,95 0,145 -120,95" fill="#090D16" fill-opacity="0.85" stroke-width="2" />
    <text x="130" y="99" class="font-mono hud" fill="#EC4899">L5 · SEGURANÇA & SIEM</text>

    <!-- Layer 4: Infrastructure & Bare-Metal -->
    <polygon class="l4" points="0,10 120,60 0,110 -120,60" fill="#0B1120" fill-opacity="0.85" stroke-width="2" />
    <text x="130" y="64" class="font-mono hud" fill="#8B5CF6">L4 · REDES & BARE-METAL</text>

    <!-- Layer 3: Data & Storage -->
    <polygon class="l3" points="0,-25 120,25 0,75 -120,25" fill="#0F172A" fill-opacity="0.85" stroke-width="2" />
    <text x="130" y="29" class="font-mono hud" fill="#6366F1">L3 · DADOS & MOTOR FISCAL</text>

    <!-- Layer 2: Local AI & Vision -->
    <polygon class="l2" points="0,-60 120,-10 0,40 -120,-10" fill="#111C35" fill-opacity="0.85" stroke-width="2" />
    <text x="130" y="-6" class="font-mono hud" fill="#38BDF8">L2 · IA LOCAL & VISÃO</text>

    <!-- Layer 1: Core Software & Apps -->
    <polygon class="l1" points="0,-95 120,-45 0,5 -120,-45" fill="#162447" fill-opacity="0.9" stroke-width="2.5" filter="url(#glow)" />
    <text x="130" y="-41" class="font-mono hud" fill="#00F0FF">L1 · ERP, WEB & FLUTTER</text>

    <!-- Central Core Axis -->
    <line x1="0" y1="-115" x2="0" y2="115" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="0" cy="-45" r="4" fill="#00F0FF" filter="url(#glow)" />
  </g>

  <text x="850" y="348" class="font-mono hud">OBJ.01 — PILHA DO SISTEMA // SPIRE & ACCOUNTECH</text>
</svg>
