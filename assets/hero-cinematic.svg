<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="16" fill="url(#grid)"/>

  <path d="M 0 320 Q 300 270 600 320 T 1200 300" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="12 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-400" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M 0 345 Q 400 385 800 315 T 1200 355" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="10 6">
    <animate attributeName="stroke-dashoffset" from="0" to="400" dur="15s" repeatCount="indefinite"/>
  </path>

  <rect width="1200" height="120" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" from="0 -150" to="0 420" dur="7s" repeatCount="indefinite"/>
  </rect>

  <rect x="2" y="2" width="1196" height="396" rx="14" fill="none" stroke="#1E293B" stroke-width="2"/>
  <line x1="60" y1="2" x2="380" y2="2" stroke="url(#accent)" stroke-width="3">
    <animate attributeName="x2" values="260;480;260" dur="5s" repeatCount="indefinite"/>
  </line>

  <circle cx="68" cy="46" r="5" fill="#10B981">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="50" font-family="monospace" font-size="12" font-weight="bold" fill="#00F0FF" letter-spacing="2">ARCHITECTURE · SOFTWARE · AI · NETWORKS · SECURITY</text>
  <text x="1140" y="50" text-anchor="end" font-family="monospace" font-size="11" font-weight="bold" fill="#64748B" letter-spacing="1.5">SYS.STACK // L1 → L5 [ONLINE]</text>

  <text x="64" y="132" font-family="sans-serif" font-size="54" font-weight="800" fill="#F8FAFC">Pedro Cruz</text>
  <text x="368" y="132" font-family="monospace" font-size="22" font-weight="bold" fill="#00F0FF">/ LN-Dark</text>

  <text x="64" y="178" font-family="sans-serif" font-size="22" fill="#94A3B8">I build <tspan fill="#F8FAFC" font-weight="bold">everything underneath it.</tspan></text>
  <text x="64" y="212" font-family="sans-serif" font-size="14" fill="#64748B">I design the architecture, write the code, train the AI layer, build the network and define the security.</text>

  <g transform="translate(64, 268)">
    <rect width="165" height="78" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.5"/>
    <text x="20" y="36" font-family="monospace" font-size="26" font-weight="bold" fill="#00F0FF">13+</text>
    <text x="20" y="58" font-family="monospace" font-size="10" font-weight="bold" fill="#64748B">YEARS BUILDING SOFTWARE</text>

    <g transform="translate(182, 0)">
      <rect width="165" height="78" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.5"/>
      <text x="20" y="36" font-family="monospace" font-size="26" font-weight="bold" fill="#F8FAFC">17+</text>
      <text x="20" y="58" font-family="monospace" font-size="10" font-weight="bold" fill="#64748B">SYSTEMS IN PRODUCTION</text>
    </g>

    <g transform="translate(364, 0)">
      <rect width="165" height="78" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.5"/>
      <text x="20" y="36" font-family="monospace" font-size="26" font-weight="bold" fill="#F8FAFC">5</text>
      <text x="20" y="58" font-family="monospace" font-size="10" font-weight="bold" fill="#64748B">ENGINEERING DOMAINS</text>
    </g>

    <g transform="translate(546, 0)">
      <rect width="165" height="78" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.5"/>
      <text x="20" y="36" font-family="monospace" font-size="26" font-weight="bold" fill="#38BDF8">CCNA</text>
      <text x="20" y="58" font-family="monospace" font-size="10" font-weight="bold" fill="#64748B">CISCO NETWORKING</text>
    </g>
  </g>

  <g transform="translate(930, 195)">
    <animateTransform attributeName="transform" type="translate" values="930,195; 930,183; 930,195" dur="5s" repeatCount="indefinite"/>
    
    <polygon points="0,45 105,90 0,135 -105,90" fill="#090D16" fill-opacity="0.9" stroke="#EC4899" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </polygon>
    <text x="115" y="94" font-family="monospace" font-size="11" font-weight="bold" fill="#EC4899">L5 · SIEM &amp; SECURITY</text>

    <polygon points="0,10 105,55 0,100 -105,55" fill="#0B1120" fill-opacity="0.9" stroke="#8B5CF6" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </polygon>
    <text x="115" y="59" font-family="monospace" font-size="11" font-weight="bold" fill="#8B5CF6">L4 · NETWORKS &amp; BARE-METAL</text>

    <polygon points="0,-25 105,20 0,65 -105,20" fill="#0F172A" fill-opacity="0.9" stroke="#6366F1" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    </polygon>
    <text x="115" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#6366F1">L3 · DATA &amp; SQL ENGINE</text>

    <polygon points="0,-60 105,-15 0,30 -105,-15" fill="#111C35" fill-opacity="0.9" stroke="#38BDF8" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </polygon>
    <text x="115" y="-11" font-family="monospace" font-size="11" font-weight="bold" fill="#38BDF8">L2 · ON-PREMISE AI &amp; VISION</text>

    <polygon points="0,-95 105,-50 0,-5 -105,-50" fill="#162447" fill-opacity="0.95" stroke="#00F0FF" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" begin="0s" repeatCount="indefinite"/>
    </polygon>
    <text x="115" y="-46" font-family="monospace" font-size="11" font-weight="bold" fill="#00F0FF">L1 · ERP, WEB &amp; FLUTTER</text>

    <line x1="0" y1="-115" x2="0" y2="115" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="0" cy="-50" r="4" fill="#00F0FF"/>
  </g>

  <text x="820" y="368" font-family="monospace" font-size="11" font-weight="bold" fill="#64748B">OBJ.01 — SYSTEM STACK // SPIRE &amp; ACCOUNTECH</text>
