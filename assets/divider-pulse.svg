<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="100%" height="12">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05070B" stop-opacity="0" />
      <stop offset="20%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="80%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#05070B" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    @keyframes moveLight {
      0% { transform: translateX(-600px); }
      100% { transform: translateX(600px); }
    }
    .beam { animation: moveLight 4s ease-in-out infinite alternate; }
  </style>
  <line x1="0" y1="6" x2="1200" y2="6" stroke="#1E293B" stroke-width="1" />
  <rect class="beam" x="450" y="4.5" width="300" height="3" rx="1.5" fill="url(#lineGrad)" />
</svg>
